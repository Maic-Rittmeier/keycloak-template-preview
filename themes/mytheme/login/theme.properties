# Inherits all templates, CSS and texts from Keycloak 26's default login theme.
parent=keycloak.v2
# common/keycloak: shared PatternFly resources. login/email-otp: the for-keycloak/email-otp-authenticator plugin (themes/email-otp).
import=common/keycloak,login/email-otp

# Load a custom CSS file in addition to Keycloak's (paths relative to resources/)
styles=css/styles.css css/custom.css

# Dark mode follows the system setting (true/false)
darkMode=true
