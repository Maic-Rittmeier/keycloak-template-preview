# Can be used two ways:
#  1) Imported into another theme via "import=email/email-otp" (see themes/mytheme/email/theme.properties) -
#     the parent below is then ignored, only the otp-email.ftl templates + messages get merged in.
#  2) Selected directly in the preview, rendering the plugin's email on plain Keycloak styling.
# buildingBlock=true: a catalog listing for this theme only shows what it ships itself (just the OTP
# email), not everything Keycloak provides - see PreviewRenderer.listingChain().
buildingBlock=true
parent=keycloak
