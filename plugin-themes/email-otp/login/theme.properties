# Can be used two ways:
#  1) Imported into another theme via "import=login/email-otp" (see themes/mytheme/login/theme.properties) -
#     this parent/import below is then ignored, only login-email-otp.ftl + messages get merged in.
#  2) Selected directly in the preview, rendering the plugin's page on plain Keycloak.v2 styling.
# buildingBlock=true: a catalog listing for this theme only shows what it ships itself (just the OTP
# page), not everything keycloak.v2 provides - see PreviewRenderer.listingChain().
buildingBlock=true
parent=keycloak.v2
import=common/keycloak
